name: Verify world history
on:
  push:
    branches: [main, feat/tier-2-world]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run verify:build
      - uses: actions/upload-artifact@v4
        with:
          name: worldweaver-production
          path: dist
          retention-days: 14
