name: Verify world history
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Install native shader compiler runtime
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri
      - run: npm run verify:shaders
      - run: npm run build
      - run: npm run verify:build
      - uses: actions/upload-artifact@v4
        with:
          name: worldweaver-production
          path: dist
          retention-days: 14
